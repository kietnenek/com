<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiet aov ios - Portfolio</title>
    <!-- Chèn font chữ mượt mà và bộ icon mạng xã hội -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* Toàn bộ cấu trúc trang */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Thanh trên cùng (Header) */
        .header-actions {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            margin-bottom: 40px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: #64748b;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            color: #3b82f6;
        }

        /* Phần thông tin cá nhân ở giữa */
        .profile-container {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeIn 1s ease-in-out;
        }

        .avatar-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #fff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        /* Vòng hào quang đỏ rực xung quanh avatar giống ảnh gốc */
        .avatar-wrapper::after {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            z-index: -1;
            opacity: 0.7;
            filter: blur(8px);
        }

        .profile-container h1 {
            font-size: 32px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Tích xanh xác minh mạng xã hội */
        .verified-badge {
            color: #3b82f6;
            font-size: 22px;
        }

        .subtitle {
            font-size: 18px;
            color: #64748b;
            margin-bottom: 25px;
        }

        .subtitle span {
            color: #6366f1;
            font-weight: 600;
        }

        /* Các nút mạng xã hội mạng ngang */
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .social-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .discord { background-color: #5865F2; }
        .telegram { background-color: #0088cc; }
        .youtube { background-color: #FF0000; }

        /* Lưới hiển thị sản phẩm ở dưới cùng */
        .product-grid {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            padding: 10px;
        }

        .product-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border: 1px solid #e2e8f0;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #ddd;
        }

        /* Hiệu ứng mượt mà khi load trang */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tương thích giao diện điện thoại */
        @media (max-width: 600px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
            .profile-container h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

    <!-- Thanh công cụ trên đầu -->
    <div class="header-actions">
        <button class="icon-btn" title="Thông báo"><i class="fa-regular fa-bell"></i></button>
        <button class="icon-btn" title="Chế độ sáng/tối"><i class="fa-regular fa-sun"></i></button>
    </div>

    <!-- Khu vực thông tin cá nhân chính -->
    <div class="profile-container">
        <div class="avatar-wrapper">
            <!-- Thay link ảnh đại diện của bạn vào chỗ chữ 'https://placeholder.com' này -->
            <img src="https://placeholder.com" alt="Avatar" class="avatar">
        </div>
        
        <h1>Kiet aov ios <i class="fa-solid fa-circle-check verified-badge" title="Đã xác minh"></i></h1>
        <p class="subtitle">and I'm a <span>Designer.</span></p>

        <!-- Hàng nút liên kết mạng xã hội -->
        <div class="social-buttons">
            <!-- Điền link tài khoản của bạn vào thẻ href="..." -->
            <a href="#" class="social-icon discord" title="Discord"><i class="fa-brands fa-discord"></i></a>
            <a href="#" class="social-icon telegram" title="Telegram"><i class="fa-brands fa-telegram"></i></a>
            <a href="#" class="social-icon youtube" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
        </div>
    </div>

    <!-- Khu vực danh sách sản phẩm hiển thị bên dưới -->
    <div class="product-grid">
        
        <!-- Sản phẩm 1 -->
        <div class="product-card">
            <!-- Thay link ảnh sản phẩm 1 vào đây -->
            <img src="https://placeholder.com" alt="Product 1" class="product-image">
        </div>

        <!-- Sản phẩm 2 -->
        <div class="product-card">
            <!-- Thay link ảnh sản phẩm 2 vào đây -->
            <img src="https://placeholder.com" alt="Product 2" class="product-image">
        </div>

        <!-- Sản phẩm 3 -->
        <div class="product-card">
            <!-- Thay link ảnh sản phẩm 3 vào đây -->
            <img src="https://placeholder.com" alt="Product 3" class="product-image">
        </div>

    </div>

</body>
</html>
